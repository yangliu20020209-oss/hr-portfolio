<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>个人作品集</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #f4f5f7; color: #171717; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    header { height: 56px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    h1 { margin: 0; font-size: 17px; font-weight: 650; }
    a { color: #fff; background: #171717; padding: 9px 14px; border-radius: 8px; text-decoration: none; font-size: 14px; white-space: nowrap; }
    main { height: calc(100% - 56px); }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
    .fallback { display: none; padding: 32px 20px; text-align: center; }
    @media (max-width: 640px) {
      header { height: 52px; padding: 0 12px; }
      h1 { font-size: 15px; }
      main { height: calc(100% - 52px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>个人作品集</h1>
    <a href="portfolio.pdf" target="_blank" rel="noopener">打开 / 下载 PDF</a>
  </header>
  <main>
    <iframe src="portfolio.pdf#view=FitH" title="个人作品集 PDF">
      <div class="fallback">当前浏览器无法预览 PDF，请点击上方按钮打开。</div>
    </iframe>
  </main>
</body>
</html>
